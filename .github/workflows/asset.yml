name: asset
on:
  push:
    paths: [assets.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canvaの書き出し画像を取ってきて置く(1行に「保存先 URL」)
        run: |
          while read -r path url; do
            case "$path" in ""|\#*) continue;; esac
            mkdir -p "$(dirname "$path")"; curl -sSL -o "$path" "$url" && ls -la "$path"
          done < assets.txt
          : > assets.txt
          git config user.name yosoukun-asset; git config user.email yosoukun-asset@users.noreply.github.com
          git add -A && git commit -qm "Canva画像を取り込み" && git pull -q --rebase && git push -q || echo nochange
