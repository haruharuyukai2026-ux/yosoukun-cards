name: engine
# 予想くんの本体を毎日自動で回す(Claude が止まっても動く)。
# 朝: データ取得→学習→サイト公開 → 締切13分前ごとに直前判定→公開→LINE。持ち時間が来たら次の実行に引き継ぐ。
# コードと記録は非公開の boat-line(ops/)にあり、鍵 BOAT_PAT で取ってくる。ログには予想を出さない。
on:
  schedule:
    - cron: "20 22 * * *"   # 日本時間 7:20
    - cron: "45 22 * * *"   # 日本時間 7:45(7:20の起動が来なかった時の予備。今日もう動いていれば何もしない)
    - cron: "15 23 * * *"   # 日本時間 8:15(同じく予備)
  push:
    paths: [engine_test.txt, engine_go.txt]   # engine_test.txt=試運転 / engine_go.txt=本番を今すぐ(GitHubの時刻起動が遅れた時の手動起動)
  workflow_dispatch:
    inputs:
      mode:
        description: "prep(朝から) / cont(続き) / test(準備だけ試す。公開・LINEなし)"
        default: prep
permissions:
  contents: write
  actions: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - name: 今日もう動いていれば何もしない(予備の時刻起動用)
        id: dup
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          today=$(date -u -d '+9 hour' +%F)
          n=$(gh run list -R ${{ github.repository }} -w engine.yml -L 20 --json databaseId,createdAt,conclusion,status \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select((.createdAt | fromdate + 32400 | strftime(\"%Y-%m-%d\")) == \"$today\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "今日の本体の実行: $n 件"
          if [ "$n" != "0" ]; then echo "skip=yes" >> $GITHUB_OUTPUT; fi
  run:
    needs: guard
    if: needs.guard.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      DIRECT_FETCH: "1"   # 公式から直接取る(Actionsの順番待ちをしない)
      MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && (contains(join(github.event.commits.*.message, ' '), '本番') && 'prep' || 'test')) || 'prep' }}
    steps:
      - name: 置き場所をつくる
        run: |
          sudo mkdir -p /home/claude && sudo chown $USER /home/claude
          git config --global user.name yosoukun-engine; git config --global user.email yosoukun-engine@users.noreply.github.com
          echo "Y=$(date +%Y%m%d)" >> $GITHUB_ENV; echo "D=$(date +%F)" >> $GITHUB_ENV
          # 持ち時間: 開始から5時間15分
          echo "STOP_AT=$(date -d '+315 min' +%H:%M)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with: { path: yc }
      - uses: actions/checkout@v4
        with:
          repository: haruharuyukai2026-ux/boat-line
          token: ${{ secrets.BOAT_PAT }}
          path: bl
      - name: コードと記録を戻す
        run: |
          mv yc /home/claude/yosoukun-cards; mv bl /home/claude/boat-line
          mkdir -p /home/claude/boatai && cd /home/claude/boatai
          tar xzf /home/claude/boat-line/ops/boatai_code.tgz && tar xzf /home/claude/boat-line/ops/boatai_state.tgz
          [ -d /home/claude/boat-line/ops/code ] && cp /home/claude/boat-line/ops/code/* .   # コードは ops/code/ が最新
          chmod +x *.sh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 道具
        run: |
          pip install -q pandas numpy scipy scikit-learn beautifulsoup4 requests
          npm i -g playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: 学習済みを戻す(続きのとき)
        if: env.MODE == 'cont'
        uses: actions/cache/restore@v4
        with:
          path: /home/claude/boatai/work/model_${{ env.Y }}.tgz
          key: model-${{ env.Y }}
      - name: 朝の準備
        if: env.MODE != 'cont'
        run: |
          set -x
          cd /home/claude/boatai
          for i in 1 2 3 4; do
            ./refresh.sh > work/ci_prep.log 2>&1 && python3 train_final.py $D >> work/ci_prep.log 2>&1 && rm -f work/today_$Y.pkl && python3 live.py prep $D >> work/ci_prep.log 2>&1
            grep -q "当日 [1-9]" work/ci_prep.log && break
            echo "出走表まだ。20分待つ"; sleep 1200
          done
          python3 daily.py $D > /dev/null && python3 racers.py $Y > /dev/null && python3 allraces.py $Y > /dev/null
          if [ "$MODE" = test ]; then grep -E "refresh done|saved models|prep done" work/ci_prep.log; python3 site_data.py > /dev/null && python3 build_site.py && NODE_PATH=$(npm root -g) node site_check.js site/public/index.html | tail -2; echo "TEST OK"; exit 0; fi
          python3 site_data.py > /dev/null && python3 build_site.py > /dev/null && python3 deploy_pages.py | tail -1
          ./state_save.sh
          tar czf work/model_$Y.tgz work/models_full.pkl work/today_$Y.pkl work/hist_long.pkl work/allwin_$Y.json work/morning_$Y.json work/params3.json work/*stats*.json work/od*.pkl
      - name: 学習済みを保存
        if: env.MODE == 'prep'
        uses: actions/cache/save@v4
        with:
          path: /home/claude/boatai/work/model_${{ env.Y }}.tgz
          key: model-${{ env.Y }}
      - name: 続きの準備
        if: env.MODE == 'cont'
        run: |
          cd /home/claude/boatai && tar xzf work/model_$Y.tgz && ./refresh.sh > /dev/null 2>&1
      - name: 直前判定(締切13分前ごと)
        if: env.MODE != 'test'
        id: drv
        run: |
          cd /home/claude/boatai
          set +e; python3 day_driver.py $Y > /dev/null 2>&1; rc=$?; set -e
          tail -3 work/driver_$Y.log | sed -E 's/[0-9]-[0-9?]+-[0-9?]+//g'
          if [ "$rc" = 3 ]; then echo "next=yes" >> $GITHUB_OUTPUT; elif [ "$rc" = 0 ]; then echo "done=yes" >> $GITHUB_OUTPUT; fi
      - name: 次の実行に引き継ぐ
        if: env.MODE != 'test' && steps.drv.outputs.next == 'yes'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run engine.yml -R ${{ github.repository }} -f mode=cont
      - name: 1日の締め(結果LINE・記録)
        if: env.MODE != 'test' && steps.drv.outputs.done == 'yes'
        run: cd /home/claude/boatai && ./day_end.sh $Y > /dev/null 2>&1; echo done
      - name: 失敗したらログを非公開の boat-line に残す(運用担当が読む)
        if: failure()
        run: |
          cd /home/claude/boat-line && mkdir -p ops/logs
          f=ops/logs/engine_$(date +%Y%m%d_%H%M).txt
          { echo "run ${{ github.run_id }} mode=$MODE"; tail -c 20000 /home/claude/boatai/work/ci_prep.log 2>/dev/null; ls -la /home/claude/boatai/work | tail -30; tail -c 4000 /home/claude/boatai/work/driver_$Y.log 2>/dev/null; } > $f 2>&1
          git add ops/logs && git commit -qm "engine 失敗ログ" && git pull -q --rebase origin main && git push -q origin main || true
