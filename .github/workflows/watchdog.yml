name: watchdog
# 本体(engine)の見張り。2026-11-02 和輝「話をするのと予想をするのを別々にできない？」
# Claude の会話の中で1時間ごとに見張るのをやめて、ここで30分ごとに見る。
# - 今日の本体が動いていない → 自動で起動し直す(朝から=prep/途中で終わっていたら=cont)
# - 本体は動いているのにサイトの更新が60分以上止まっている → この見張りを「失敗」にする(GitHubから失敗のメールが届く)
on:
  schedule:
    - cron: "20,50 22,23,0-11 * * *"   # 日本時間 7:20〜20:50 の30分ごと
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: watchdog
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 見張り
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          now_hm=$(TZ=Asia/Tokyo date +%H:%M); today=$(TZ=Asia/Tokyo date +%F)
          last=$(python3 -c "import json;A=json.load(open('allraces.json'));print(max((r.get('deadline') or '') for r in A['races']) if A.get('date')=='$today' else '')" 2>/dev/null || echo "")
          upd=$(python3 -c "import json;print(json.load(open('data.json')).get('updated',''))")
          runs=$(gh run list -R ${{ github.repository }} -w engine.yml -L 20 --json databaseId,createdAt,status,conclusion)
          active=$(echo "$runs" | jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          today_ok=$(echo "$runs" | jq --arg d "$today" '[.[] | select((.createdAt | fromdate + 32400 | strftime("%Y-%m-%d")) == $d) | select(.conclusion=="success")] | length')
          echo "今 $now_hm / 最終締切 ${last:-不明} / サイト更新 $upd / 本体 動作中=$active 今日の成功=$today_ok"
          # 最終レースの締切+20分を過ぎたら見張りはおしまい
          if [ -n "$last" ] && [[ "$now_hm" > "$(date -d "$last 20 min" +%H:%M)" ]]; then echo "今日のレースは終わり"; exit 0; fi
          if [ "$active" = "0" ]; then
            if [ "$today_ok" = "0" ]; then mode=prep; else mode=cont; fi
            # 朝 7:50 より前は本体の時刻起動(7:20/7:45)を待つ
            if [[ "$now_hm" < "07:50" ]]; then echo "まだ朝の起動待ち"; exit 0; fi
            echo "本体が止まっている → $mode で起動し直す"
            gh workflow run engine.yml -R ${{ github.repository }} -f mode=$mode
            exit 0
          fi
          # 本体は動いている:サイトの更新が60分以上止まっていないか(判定の時間帯だけ)
          age=$(( ( $(date +%s) - $(TZ=Asia/Tokyo date -d "$upd" +%s) ) / 60 ))
          echo "サイト更新から $age 分"
          if [[ "$now_hm" > "08:40" ]] && [ "$age" -ge 60 ]; then echo "::error::本体は動いているのにサイトの更新が${age}分止まっている"; exit 1; fi
