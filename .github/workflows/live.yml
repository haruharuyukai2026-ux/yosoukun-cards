name: live
on:
  schedule:
    - cron: "*/5 23,0-13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: live
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q beautifulsoup4
      - name: 展示と結果を取る
        run: python3 live_update.py
      - name: 保存
        run: |
          git config user.name yosoukun-live; git config user.email yosoukun-live@users.noreply.github.com
          git add live.json && git commit -qm "live $(date -u +%H:%M)" && git pull -q --rebase && git push -q || echo nochange
