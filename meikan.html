<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選手名鑑|予想くんの的中ラボ</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#0b2545;--deep:#081a33;--panel:#102e55;--line:#1f4472;--ink:#f2f6fb;--sub:#9fb6cf;--gold:#ffd166;--hit:#3ccf7d;--red:#e63946}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
header{background:var(--deep);padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 6px 12px rgba(0,0,0,.35)}
header .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
header a{color:var(--sub);text-decoration:none;font-size:13px;white-space:nowrap}
header h1{margin:0;font-size:20px;font-weight:900;flex:1}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--sub)}
.lead{color:var(--sub);font-size:13px;margin:14px 0 10px;line-height:1.6}
.f{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.f button{flex:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.f button.on{background:var(--gold);color:#0b1a2e;border-color:var(--gold)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--ink);font-size:16px;margin-bottom:10px}
.cnt{font-size:12px;color:var(--sub);margin:4px 0 8px}
.rl{display:grid;gap:6px}
.r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
.r .nm{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 級別バッジは本体(template.html の .kb)と同じ見た目:明るいほど強い */
.cls{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:900;line-height:1;box-sizing:border-box}
.cls.A1{background:#fff;color:#0b2545}.cls.A2{border:2px solid #fff;color:#fff}.cls.B1{border:1.5px solid var(--sub);color:var(--sub)}.cls.B2{border:1px dashed var(--line);color:#7d8ea3}
.r .br{font-size:11px;color:var(--sub);font-weight:400}
.r .nb{display:flex;gap:12px;font-size:12px;color:var(--sub);grid-column:1/-1}
.r .nb b{color:var(--ink);font-size:14px;margin-left:2px}
.r .td{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.r .td span{font-size:11px;background:var(--deep);border-radius:6px;padding:2px 6px}
.r .go{align-self:center;color:var(--sub);font-size:20px}
.more{display:block;width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--gold);font-weight:800;font-size:14px}
.note{color:var(--sub);font-size:13px;text-align:center;padding:20px}
</style></head><body>
<header><div class="in"><a href="./">‹ 的中ラボ</a><h1>選手名鑑</h1></div></header>
<main class="wrap">
<input id="q" type="search" placeholder="名前で絞る" autocomplete="off">
<div class="f" id="fv"></div>
<div class="f" id="fc"></div>
<div class="f" id="fs"></div>
<div class="cnt" id="cnt"></div>
<div class="rl" id="rl"><p class="note">読み込み中…</p></div>
</main>
<script>
let P=[],V='すべて',C='すべて',S='win',N=40;
const R=x=>x.code?`${x.venue}${+x.code.slice(10)}R`:'';
const draw=()=>{const q=document.getElementById('q').value.replace(/\s/g,'');
 let L=P.filter(p=>(V==='すべて'||p.races.some(x=>x.venue===V))&&(C==='すべて'||p.cls===C)&&(!q||p.name.replace(/\s/g,'').includes(q)));
 const k={win:p=>-(+p.win||0),st:p=>(+p.st||9),top2:p=>-(+p.top2||0)}[S];L.sort((a,b)=>k(a)-k(b));
 document.getElementById('cnt').textContent=`${L.length}人`;
 document.getElementById('rl').innerHTML=L.length?L.slice(0,N).map(p=>`<a class="r" href="./#p${p.no}"><div class="nm">${p.name}<span class="cls ${p.cls}">${p.cls}</span><span class="br">${p.branch} ${p.ki||''}</span></div><span class="go">›</span>
  <div class="nb"><span>勝率<b>${p.win||'—'}</b></span><span>2連対率<b>${p.top2?p.top2+'%':'—'}</b></span><span>平均ST<b>${p.st||'—'}</b></span></div>
  <div class="td">${p.races.map(x=>`<span>${R(x)} ${x.waku}号艇</span>`).join('')}</div></a>`).join('')+(L.length>N?`<button class="more" id="mr">もっと見る(あと${L.length-N}人)</button>`:''):'<p class="note">この条件の選手はいないよ</p>';
 const m=document.getElementById('mr');if(m)m.onclick=()=>{N+=40;draw()};
 chips()};
const chips=()=>{const vs=['すべて',...new Set(P.flatMap(p=>p.races.map(x=>x.venue)))];
 document.getElementById('fv').innerHTML=vs.map(v=>`<button class="${v===V?'on':''}" data-v="${v}">${v}</button>`).join('');
 document.getElementById('fc').innerHTML=['すべて','A1','A2','B1','B2'].map(v=>`<button class="${v===C?'on':''}" data-c="${v}">${v==='すべて'?'全級別':v}</button>`).join('');
 document.getElementById('fs').innerHTML=[['win','勝率が高い順'],['top2','2連対率が高い順'],['st','スタートが早い順']].map(([v,t])=>`<button class="${v===S?'on':''}" data-s="${v}">${t}</button>`).join('')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){V=b.dataset.v;N=40;draw()}if(b.dataset.c){C=b.dataset.c;N=40;draw()}if(b.dataset.s){S=b.dataset.s;draw()}});
document.getElementById('q').addEventListener('input',()=>{N=40;draw()});
fetch('racers.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{P=Object.values(j.racers||{});draw()}).catch(()=>{document.getElementById('rl').innerHTML='<p class="note">いま準備中だよ</p>'});
</script>
</body></html>
